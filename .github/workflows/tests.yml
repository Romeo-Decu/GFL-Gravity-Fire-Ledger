name: FiF software tests

on:
  push:
    branches:
      - main
      - docs/scientific-system-architecture-v0.1
      - feat/visualization-architecture-v0.1
      - 'feat/**'
      - 'acquisition/**'
  pull_request:
    branches:
      - main

jobs:
  unit-and-case-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "cryptography==46.0.3" "numpy==2.2.6" "pytest==8.3.5"
      - name: Run test suite (pytest also collects plain test functions that unittest skips)
        run: python -m pytest -q tests
      - name: Verify the GFL ledger (chain, signatures, repo objects; raw NASA bytes are not in CI)
        run: PYTHONPATH=src python -m gfl_ledger verify --fif-data /nonexistent --allow-missing

  visualization-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Run graph adapter tests
        run: npm --prefix visualization test
      - name: Check visualization JavaScript syntax
        run: npm --prefix visualization run check
      - name: Install pinned Playwright dependency
        run: npm install --prefix visualization --no-package-lock
      - name: Install Chromium and Firefox
        run: visualization/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Run cross-browser smoke tests
        run: npm --prefix visualization run test:browser
      - name: Run GFL dashboard smoke tests (ledger verification in the browser)
        run: npm --prefix visualization run test:gfl
