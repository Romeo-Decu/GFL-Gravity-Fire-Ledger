<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="Code, text, charts, logo and icons written with AI assistance (Claude, Anthropic) for team CCTI; see docs/AI_AND_TOOLS_DISCLOSURE_v1.0.md">
  <title>GFL | Function specification</title>
  <link rel="icon" href="./assets/brand/GFL_mark_32.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./gfl.css">
  <style>
    .spec { max-width: 760px; margin: 0 auto; padding: 40px 0 80px; }
    .spec h1 { font-family: var(--serif); font-size: 2.2rem; margin: 18px 0 8px; }
    .spec h2 { font-size: 1.15rem; margin: 30px 0 8px; }
    .spec p, .spec li { font-family: var(--serif); font-size: 1.06rem; line-height: 1.65; color: #cfd8e2; }
    .spec code { font-family: var(--mono); font-size: 0.88em; color: var(--blue); }
    .spec table { border-collapse: collapse; font-size: 0.86rem; display: block; overflow-x: auto; margin: 12px 0; }
    .spec th, .spec td { border-bottom: 1px solid var(--rule); padding: 7px 8px; text-align: left; vertical-align: top; }
    .spec pre { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
    .spec { max-width: 900px; }
    .banner { border: 1px dashed var(--rule); border-radius: 8px; padding: 10px 14px; color: var(--muted); font-size: 0.9rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./gfl.html"><img src="./assets/brand/GFL_mark_simple.svg" alt="" width="40" height="40"><span>Gravity Fire Ledger</span></a>
    <nav><a href="./gfl.html#capabilities" onclick="if(history.length>1){history.back();return false}">Back to the function map</a></nav>
  </header>
  <main><article class="spec" id="spec"><p>Loading…</p></article></main>
  <script>
    const doc = new URLSearchParams(location.search).get("doc") || "";
    const el = document.getElementById("spec");
    if (!/^(SPEC_[a-z_]+|USER_GUIDE_v1|HOW_THE_QUESTION_CHANGED_v1)\.md$/.test(doc)) { el.innerHTML = "<p>No specification named. Return to the function map and choose one.</p>"; }
    else fetch("./data/specs/" + doc).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }).then((md) => {
      el.innerHTML = (doc.startsWith("SPEC_") ? '<p class="banner">Specification of a function that is designed or partly built. It states what we want and how it will be done; it is not a claim that the function exists. Source: docs/specs/' + doc + "</p>" : '<p class="banner">Source: docs/' + doc + "</p>") + marked.parse(md);
      document.title = "GFL — " + (md.match(/^# (.+)$/m) || [, "specification"])[1];
    }).catch(() => { el.innerHTML = "<p>This specification could not be loaded. Check that data/specs/" + doc + " is published with the page.</p>"; });
  </script>
</body>
</html>
